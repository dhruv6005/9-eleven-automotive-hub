spring:
  application:
    name: automotive-hub-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
app:
  security:
    trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES:}
    jwt-secret: ${APP_JWT_SECRET}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:noreply@9elevenautomotive.example}
  admin:
    email: ${ADMIN_EMAIL:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
