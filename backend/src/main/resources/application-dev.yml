spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/automotive_hub}
    username: ${DB_USERNAME:automotive}
    password: ${DB_PASSWORD:localdev-change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
logging:
  level:
    com.nineeleven.automotive: INFO
    org.flywaydb: INFO
